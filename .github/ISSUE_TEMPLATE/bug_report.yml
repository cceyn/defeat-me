name: Bug report
description: Report a reproducible problem with defeat-me.
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the agent, client, operating system, and relevant versions.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest steps that reproduce the issue. Remove secrets and personal data.
    validations:
      required: true
